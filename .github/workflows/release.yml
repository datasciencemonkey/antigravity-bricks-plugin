name: release

# When the tests pass on a commit on main, tag that commit and publish a release for it, if its version has no tag yet
# and is newer than every release tag that exists. The version is the one in plugins/databricks-genie/plugin.json
# (tools/release_tag.py reads it). This workflow never bumps or edits it: a person raises the last number (0.3.0,
# 0.3.1, 0.3.2, ...) in the manifest.
# The release notes are only the ones tools/release_notes.py writes: the pull requests merged since the previous
# release that come from this repository and were opened by its owner, members or collaborators, and a link that
# compares the two tags. GitHub's generated notes are not added, because they name every merged pull request, the ones
# from forks included. Listing pull requests needs no permission beyond the one below because the repository is public.
on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: write # making the tag and the release is all this token does; nothing else is granted

# One release job at a time. A run that arrives while another is going waits for it and the running one is never
# cancelled (GitHub lets only one run wait, so a newer waiting run replaces an older waiting one).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A failed run, or a run for anything but a push, releases nothing.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (the comment names the release), the same one as in tests.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # the commit the tests passed on, not wherever main is by now
          fetch-depth: 0 # the whole history and every tag, to see which release tags exist
          fetch-tags: true
          persist-credentials: false # nothing here pushes; gh gets its token from GH_TOKEN
      - name: Tag and release this commit if its version is new
        env:
          # Event data and the token reach the script only as environment variables, never as expressions in its text.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # This workflow runs as it is on main, so a tests run that ends after it landed can fire it for an older
          # commit, which has no release scripts. That commit predates releases: say so and stop, don't fail.
          for script in tools/release_tag.py tools/release_notes.py; do
            if [ ! -f "$script" ]; then
              echo "::notice title=Nothing to release::$script is not in this commit, which predates the release scripts."
              exit 0
            fi
          done
          # The commit comes from the event and goes onto git's command line below, so it must be a full SHA.
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The commit to release is not a full commit SHA."
            exit 1
          fi
          # Only a commit on main is released. The tests also run for a pushed tag, and then the event's branch is the
          # tag's name, which can be "main" while the tag points at any commit. The branch is named in full because git
          # reads a short origin/main as a tag of that name first, and a pushed tag called origin/main would stand in
          # for it. (Exit status 1 means "not an ancestor"; anything else, such as a checkout without the branch, is an
          # error and stops the step.)
          status=0
          git merge-base --is-ancestor "$HEAD_SHA" refs/remotes/origin/main || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::notice title=Nothing to release::This commit is not on main."
            exit 0
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          TAG="$(python3 tools/release_tag.py)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to release."
            exit 0
          fi
          # gh says "release not found" when there is no such release. Any other failure (the API is down, the token
          # can't read releases) answers nothing, so it stops the step instead of counting as "no release yet".
          if RELEASE="$(gh release view "$TAG" 2>&1)"; then
            echo "A release for $TAG already exists; nothing to release."
            exit 0
          fi
          case "$RELEASE" in
            *"release not found"*) ;;
            *)
              echo "::error::gh release view failed, so the step can't tell whether $TAG has a release."
              echo "$RELEASE" >&2
              exit 1
              ;;
          esac
          # Never make a release for a version that is not newer than a release tag that exists. Without this, a re-run
          # of the tests for an old commit, or a version that was skipped, would add a release out of order. The answer
          # goes into a variable so that a failing git (set -e, pipefail) stops the step instead of reading as "no tags".
          NEWER="$(git tag --list 'v*' | python3 tools/release_tag.py --newer-than-tags)"
          if [ -z "$NEWER" ]; then
            echo "::notice title=Nothing to release::$TAG is not newer than a release tag that already exists."
            exit 0
          fi
          # Pull request titles and bodies are untrusted text. tools/release_notes.py turns the pull requests merged
          # since the previous release into a notes file, and that file is the only way their text reaches gh. It names
          # the tag being released for the "Full changelog" link, which takes the place of GitHub's generated notes.
          PULLS="$RUNNER_TEMP/pulls.json"
          NOTES="$RUNNER_TEMP/release-notes.md"
          gh api --paginate "repos/{owner}/{repo}/pulls?state=closed&base=main&per_page=100" > "$PULLS"
          python3 tools/release_notes.py --repo "$GH_REPO" --tag "$TAG" --pulls "$PULLS" --head "$HEAD_SHA" --output "$NOTES"
          # The tag is made first, at exactly the commit that was tested, and then released. The release command's
          # --target only chooses the commit while the tag doesn't exist, so a tag that someone made after the checkout
          # could otherwise decide where the release points. This call fails if the tag exists, and --verify-tag makes
          # gh use the tag made here instead of making one itself.
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$HEAD_SHA" >/dev/null
          if ! gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES"; then
            # gh can report a failure after GitHub has made the release (a lost response, a 502). Taking the tag of a
            # published release away turns that release into a draft, which the next run's check for a release would
            # find and count as released for good. So the tag is taken back only when gh confirms there is no release.
            if AFTER="$(gh release view "$TAG" 2>&1)"; then
              echo "::error::Making the release for $TAG failed, but a release for it exists, so its tag stays. Check it."
            else
              case "$AFTER" in
                *"release not found"*)
                  # No release: don't leave a tag without one, or the next run would see the tag and never make it.
                  if ! gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null; then
                    echo "::error::Making the release for $TAG failed and its tag could not be taken back. Delete the tag by hand."
                  fi
                  ;;
                *)
                  echo "::error::Making the release for $TAG failed, and looking for it failed too, so its tag stays. Check both."
                  echo "$AFTER" >&2
                  ;;
              esac
            fi
            exit 1
          fi
