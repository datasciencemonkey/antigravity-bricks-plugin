[project]
name = "antigravity-bricks-plugin"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

# Lock against public PyPI whatever index this machine is configured with; otherwise uv.lock records that index.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
